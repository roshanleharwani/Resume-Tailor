# render.yaml — Render Blueprint for Resume Tailor
# Services: Redis (job status), Flask API (with inline threading), Next.js Frontend

services:
  # ─────────────────────────────────────────────
  # 1. Redis (managed) — stores job status
  # ─────────────────────────────────────────────
  - type: redis
    name: resume-tailor-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ─────────────────────────────────────────────
  # 2. Flask API (Web Service, Docker)
  #    Runs crewai-tools==0.8.4 in background threads
  # ─────────────────────────────────────────────
  - type: web
    name: resume-tailor-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.api
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: resume-tailor-redis
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ─────────────────────────────────────────────
  # 3. Next.js Frontend (Web Service)
  # ─────────────────────────────────────────────
  - type: web
    name: resume-tailor-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABSE_DB_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_FLASK_URL
        sync: false   # Set to https://resume-tailor-api.onrender.com after first deploy
      - key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
